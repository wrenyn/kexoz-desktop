name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Typecheck + build
        working-directory: frontend
        run: npm run build
        env:
          VITE_KEXOZ_API_BASE: "https://api.kexoz.dev"
          VITE_KEXOZ_ROOT_DOMAIN: "kexoz.dev"
  electron:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - name: Install
        working-directory: electron
        run: npm ci
      - name: Lint
        working-directory: electron
        run: npm run lint
