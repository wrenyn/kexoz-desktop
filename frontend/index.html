<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <meta name="theme-color" content="#101310" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kexoz</title>
    <style>
      @font-face { font-family: 'Space Grotesk'; src: url('/fonts/space-grotesk-latin-variable.woff2') format('woff2'); font-weight: 300 700; font-style: normal; font-display: swap; }
      html, body {
        margin: 0;
        min-height: 100%;
        background: #101310;
        color: #EDF2E9;
      }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 13px;
        background: radial-gradient(circle at 50% 45%, rgba(183, 247, 95, .09), transparent 24%), #101310;
        font-family: 'Space Grotesk', system-ui, sans-serif;
        transition: opacity 0.2s ease;
      }
      #boot[hidden] { display: none; }
      #boot .mark {
        position: relative;
        width: 72px;
        height: 72px;
        display: grid;
        place-items: center;
      }
      #boot .mark svg { width: 64px; height: 64px; filter: drop-shadow(0 10px 24px rgba(0,0,0,.3)); }
      #boot .edge { stroke: #B6F36B; stroke-width: 10; stroke-dasharray: .22 .78; animation: boot-trace 1.8s linear infinite; }
      #boot .signal { animation: boot-signal 1.8s ease-in-out infinite; }
      @keyframes boot-trace { to { stroke-dashoffset: -1; } }
      #boot .brand {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.03em;
      }
      #boot .status {
        font-size: 12px;
        color: #9AA89A;
      }
      #boot .line { width: 104px; height: 2px; overflow: hidden; border-radius: 99px; background: #303A30; }
      #boot .line::after { content: ''; display: block; width: 44%; height: 100%; background: linear-gradient(90deg,transparent,#B7F75F,transparent); animation: boot-progress 1.35s cubic-bezier(.16,1,.3,1) infinite; }
      @keyframes boot-orbit { to { transform: rotate(360deg); } }
      @keyframes boot-breathe { 50% { transform: scale(1.035); } }
      @keyframes boot-signal { 50% { opacity: .4; } }
      @keyframes boot-progress { from { transform: translateX(-130%); } to { transform: translateX(320%); } }
      @media (prefers-reduced-motion: reduce) { #boot *, #boot *::before, #boot *::after { animation: none !important; } }
    </style>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('kexoz-theme');
          var theme = saved === 'light' || saved === 'dark'
            ? saved
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.dataset.theme = theme;
          if (theme === 'light') {
            document.documentElement.style.background = '#EDF2E9';
          }
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="boot" aria-live="polite">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 512 512" fill="none">
          <rect x="8" y="8" width="496" height="496" rx="124" fill="#0E120F"/>
          <rect x="8" y="8" width="496" height="496" rx="124" class="edge" pathLength="1"/>
          <path d="M140 116h76v118l116-118h96L278 266l156 130H328L216 300v96h-76V116Z" fill="#F4F7F2"/>
          <path class="signal" d="m216 226 46 40-46 40v-80Z" fill="#B7F75F"/>
        </svg>
      </div>
      <div class="brand">Kexoz</div>
      <div class="status">Starting Kexoz…</div>
      <div class="line" aria-hidden="true"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
